<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>
        FAQ - frequently Asked Questions 
    </h1>
        <div class = "faq">
            <details th: each="d : ${duvidas}">
                <summary th:text="${d.texto}"> </summary>
                <p class="info">
                    Enviada em :<span th:text="${#temporals.format(d.dataHora, 'dd/MM/yyyy HH:mm')}">17/10/2026 09:00</span> 
                    
                </p>

            </details>
            <p th:if="${#list.isEmpty(duvidas)}">Não existe dúvidas cadastradas no momento</p>
        </div>
        <from th:action="@{/faq/excluir}" method="post">
        <input type="hidden" name ="id"th:value="${d.id}">
        <button type ="submit" class = "btn btn-dngr btn-sm">excluir</button>
        </from> 
    
</body>
</html>
